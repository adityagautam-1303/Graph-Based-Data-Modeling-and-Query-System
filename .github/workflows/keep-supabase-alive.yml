name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 00:00 UTC (resets the 7-day inactivity pause)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual run from GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase REST API..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 204 ]; then
            echo "Successfully pinged Supabase! Inactivity timer reset."
          else
            echo "Warning: Received HTTP $HTTP_STATUS"
            cat response.json
            exit 1
          fi
